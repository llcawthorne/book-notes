# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:

  number:
    currency:
      format:
        unit:      "$"
        precision: 2
        separator: "."
        delimiter: ","
        format:    "%u%n"

  time:
    formats:
      short: "%m/%d/%Y %I:%M %p"

  errors:
    template:
      body:        "There were problems with the following fields:"
      header:       
        one:       "1 error prohibited this %{model} from being saved"
        other:     "%{count} errors prohibited this %{model} from being saved"
        
  layouts:
    application:
      title:      "The Pragmatic Bookshelf"
      home:       "Home"
      questions:  "Questions"
      news:       "News"
      contact:    "Contact"
      login:      "Login"
  carts:
    cart:
      title:      "Your Cart"
      empty:      "Empty cart"
      checkout:   "Checkout"
      total:      "Total:"
    destroy:
      empty_notice: "Your cart is currently empty"

  line_items:
    line_item:
      decrement:  "Decrease quantity"
      increment:  "Increase quantity"
      remove:     "Remove"
    destroy:
      notice: "Line item was successfully destroyed."
    invalid_product:
      alert: "That product is no longer available."

  store:
    index:
      title_html: "Your Pragmatic Catalog"
    product:
      add_html:   "Add to Cart"

  orders:
    new:
      legend:       "Please Enter Your Details"
      title:        "Checkout"
      empty_cart_notice: "Your cart is empty"
    form:
      name:         "Name"
      address_html: "Address"
      email:        "E-mail"
      coupon_code:  "Coupon code"
      subtotal:     "Subtotal:"
      discount:     "Discount (%{percent}%):"
      total:        "Total:"
      pay_type:     "Pay with"
      pay_prompt_html: "Select a payment method"
      submit:       "Place Order"
      pay_types:
        "Check":           "Check"
        "Credit card":     "Credit Card"
        "Purchase order":  "Purchase Order"
    check:
      routing_number: "Routing #"
      account_number: "Account #"
    cc:
      cc_number: "CC #"
      expiration_date: "Expiry"
      expiration_placeholder: "e.g. 03/22"
    po:
      po_number: "PO #"


  thanks:          "Thank you for your order"

  order_mailer:
    received:
      subject:       "Pragmatic Store Order Confirmation"
      dear:          "Dear %{name}"
      thanks:        "Thank you for your recent order from The Pragmatic Store."
      items_ordered: "You ordered the following items:"
      subtotal:      "Subtotal: %{amount}"
      discount:      "Discount (%{percent}%): -%{amount}"
      total:         "Total: %{amount}"
      ships_notice:  "We'll send you a separate e-mail when your order ships."
    shipped:
      subject:     "Pragmatic Store Order Shipped"
      title:       "Pragmatic Order Shipped"
      notice:      "This is just to let you know that we've shipped your recent order:"
      qty:         "Qty"
      description: "Description"
    payment_failed:
      subject:      "Pragmatic Store Payment Failed"
      dear:         "Dear %{name}"
      intro:        "We were unable to process payment for your recent order from The Pragmatic Store:"
      retry_notice: "Please check your payment details and try again, or contact us if you believe this is an error."
