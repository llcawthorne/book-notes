es:

  number:
    currency:
      format:
        unit:      "$US"
        precision: 2
        separator: ","
        delimiter: "."
        format:    "%n&nbsp;%u"

  # Not used by time.formats.short below, but kept for a future long-form
  # date/time format (%B substitutes from this list).
  date:
    month_names:
      [ ~, enero, febrero, marzo, abril, mayo, junio, julio, agosto,
        septiembre, octubre, noviembre, diciembre ]

  time:
    formats:
      short: "%d/%m/%Y %I:%M %p"

  activerecord:
    models:
      order:       "pedido"
    attributes:
      order:
        address:   "Direcci&oacute;n"
        name:      "Nombre"
        email:     "E-mail"
        pay_type:  "Forma de pago"
    errors:
      messages:
        inclusion: "no est&aacute; incluido en la lista"
        blank:     "no puede quedar en blanco"
  errors:
    template:
      body:        "Hay problemas con los siguientes campos:"
      header:
        one:       "1 error ha impedido que este %{model} se guarde"
        other:     "%{count} errores han impedido que este %{model} se guarde"

  layouts:
    application:
      title:      "Biblioteca de Pragmatic"
      home:       "Inicio"
      questions:  "Preguntas"
      news:       "Noticias"
      contact:    "Contacto"
      login:      "Iniciar sesión"
  carts:
    cart:
      title:      "Carrito de la Compra"
      empty:      "Vaciar Carrito"
      checkout:   "Comprar"
      total:      "Total:"
    destroy:
      empty_notice: "Su carrito está vacío en este momento"

  line_items:
    line_item:
      decrement:  "Disminuir cantidad"
      increment:  "Aumentar cantidad"
      remove:     "Eliminar"
    destroy:
      notice: "El artículo se eliminó correctamente."
    invalid_product:
      alert: "Ese producto ya no está disponible."

  store:
    index:
      title_html: "Su Cat&aacute;logo de Pragmatic"
    product:
      add_html:   "A&ntilde;adir al Carrito"

  orders:
    new:
      legend:       "Por favor, introduzca sus datos"
      title:        "Finalizar Compra"
      empty_cart_notice: "Su carrito está vacío"
    form:
      name:         "Nombre"
      address_html: "Direcci&oacute;n"
      email:        "E-mail"
      coupon_code:  "Código de cupón"
      subtotal:     "Subtotal:"
      discount:     "Descuento (%{percent}%):"
      total:        "Total:"
      pay_type:     "Forma de pago"
      pay_prompt_html: "Seleccione un método de pago"
      submit:       "Realizar Pedido"
      pay_types:
        "Check":           "Cheque"
        "Credit card":     "Tarjeta de Crédito"
        "Purchase order":  "Orden de Compra"
    check:
      routing_number: "# de Enrutamiento"
      account_number: "# de Cuenta"
    cc:
      cc_number: "Número"
      expiration_date: "Expiración"
      expiration_placeholder: "ej. 03/22"
    po:
      po_number: "Número"


  thanks:          "Gracias por su pedido"
