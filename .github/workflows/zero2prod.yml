name: zero2prod CI

on:
  push:
    branches: [main]
    paths:
      - "rust/zero-to-prod/zero2prod/**"
      - ".github/workflows/zero2prod.yml"
  pull_request:
    branches: [main]
    paths:
      - "rust/zero-to-prod/zero2prod/**"
      - ".github/workflows/zero2prod.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://postgres:password@127.0.0.1:5432/newsletter

defaults:
  run:
    working-directory: rust/zero-to-prod/zero2prod

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: newsletter
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: taiki-e/install-action@sqlx-cli
      - run: sqlx database create && sqlx migrate run
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/zero-to-prod/zero2prod
      - run: cargo clippy --all-targets -- -D warnings

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/zero-to-prod/zero2prod
      - run: cargo doc --no-deps

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: newsletter
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@sqlx-cli
      - run: sqlx database create && sqlx migrate run
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/zero-to-prod/zero2prod
      - run: cargo test --all-targets --locked

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: newsletter
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@sqlx-cli
      - run: sqlx database create && sqlx migrate run
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/zero-to-prod/zero2prod
      - uses: taiki-e/install-action@cargo-tarpaulin
      - run: cargo tarpaulin --ignore-tests --locked

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      # RUSTSEC-2026-0258 (h2 0.3 via actix-web 4) and RUSTSEC-2026-0381 (webpki-roots 0.26 via sqlx 0.8)
      # have no non-breaking upstream fix yet.
      # RUSTSEC-2026-0459 (libsqlite3-sys via sqlx-sqlite) and RUSTSEC-2023-0071 (rsa via sqlx-mysql)
      # are uncompiled optional dependencies in Cargo.lock (only sqlx's postgres feature is enabled).
      - run: cargo audit --ignore RUSTSEC-2026-0258 --ignore RUSTSEC-2026-0381 --ignore RUSTSEC-2026-0459 --ignore RUSTSEC-2023-0071
